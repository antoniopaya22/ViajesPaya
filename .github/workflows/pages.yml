name: Publicar ViajesPaya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar datos, imágenes y CSS
        run: node scripts/validate.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generar bundles de datos por ciudad
        run: node scripts/generate-bundles.js
      - name: Preparar archivos públicos
        run: |
          mkdir _site
          cp index.html styles.css script.js japan.js credits.js japan-credits.js favicon.svg manifest.json sw.js .nojekyll _site/
          cp -R data _site/
          cp -R assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
